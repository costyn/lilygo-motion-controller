name: PlatformIO CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        pip install --upgrade platformio
        pio --version

    - name: Build firmware
      run: pio run --environment pico32

    - name: Build SPIFFS filesystem
      run: pio run --target buildfs --environment pico32

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-pico32
        path: |
          .pio/build/pico32/firmware.bin
          .pio/build/pico32/firmware.elf
        retention-days: 30

    - name: Upload SPIFFS artifact
      uses: actions/upload-artifact@v4
      with:
        name: spiffs-pico32
        path: .pio/build/pico32/spiffs.bin
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Install dependencies
      run: pnpm install

    - name: Download all firmware artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        cp artifacts/firmware-pico32/firmware.bin release-assets/
        cp artifacts/firmware-pico32/firmware.elf release-assets/
        cp artifacts/spiffs-pico32/spiffs.bin release-assets/

    - name: Run semantic-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npx semantic-release
