; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pico32
; default_envs = pico32-OTA

[env:pico32]
platform = https://github.com/pioarduino/platform-espressif32.git
board = pico32
framework = arduino
board_build.filesystem = spiffs
board_build.partitions = min_spiffs.csv   ; Use partition scheme with larger app space
extra_scripts = pre:pre_uploadfs.py
lib_deps =
    AccelStepper
    TMCStepper
    OneButton  ; Still used by ButtonController (debug buttons)
    tzapu/WiFiManager
    ESP32Async/ESPAsyncWebServer@3.8.1
    ayushsharma82/ElegantOTA
    bblanchon/ArduinoJson
build_flags =
    -std=c++14
    -Wno-pragmas
    -Wno-format
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -Os                          ; Optimize for size
    -ffunction-sections          ; Enable function-level linking
    -fdata-sections              ; Enable data-level linking
    -Wl,--gc-sections            ; Remove unused sections
    -DCORE_DEBUG_LEVEL=0         ; Disable debug output in core
monitor_speed = 115200
upload_speed = 1500000
check_skip_packages = yes

[env:pico32-OTA]
extends = env:pico32
extra_scripts =
    pre:pre_uploadfs.py
    platformio_upload.py
upload_protocol = custom
custom_upload_url = http://lilygo-motioncontroller.local/update

; Native environment for unit testing
[env:native]
platform = native
test_ignore = test_embedded
test_filter = test_native/test_*
build_src_filter = -<*>
lib_deps =
build_flags =
    -std=c++14
    -DUNIT_TEST
    -DUNITY_INCLUDE_DOUBLE
    -I test/test_native/test_configuration/mock

